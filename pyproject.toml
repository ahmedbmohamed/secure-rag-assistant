[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-rag-assistant"
version = "1.0.0"
description = "Secure RAG assistant for security standards and internal policies, local by default"
requires-python = ">=3.11"
authors = [{ name = "Ahmed Benmohamed" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S105", "S106", "S608", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"eval/*" = ["S"]
