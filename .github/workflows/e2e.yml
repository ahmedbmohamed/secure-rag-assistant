name: End-to-end with a local LLM

# Runs the full stack with a real model (Ollama, qwen2.5:3b on CPU) and the real embeddings,
# measures the answers and captures the README screenshots. Started by hand: it takes a while.
on:
  workflow_dispatch:

permissions:
  contents: write  # only to publish the results to the e2e-results branch

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      SRAG_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SRAG_OLLAMA_URL: http://127.0.0.1:11434
      SRAG_OLLAMA_MODEL: qwen2.5:3b
      SRAG_EMBED_CACHE_DIR: ${{ github.workspace }}/.models
      SRAG_MANIFEST_KEY: e2e-only-key-generated-for-this-run-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e . && pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Install Ollama and pull the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:11434 && break; sleep 2; done
          ollama pull qwen2.5:3b
      - name: Index and create users
        run: |
          python -m srag.ingest.pipeline
          python scripts/create_users.py > keys.txt
          for name in admin user1 user2; do
            value=$(grep "^  $name " keys.txt | awk '{print $NF}')
            echo "::add-mask::$value"
            echo "SRAG_PASSWORD_$(echo $name | tr a-z A-Z)=$value" >> $GITHUB_ENV
          done
          for pair in USER1:svc-eval-staff USER2:svc-eval-admin; do
            value=$(grep "^  ${pair#*:} " keys.txt | awk '{print $NF}')
            echo "::add-mask::$value"
            echo "SRAG_KEY_${pair%%:*}=$value" >> $GITHUB_ENV
          done
          rm keys.txt
      - name: Start the API and web interface
        run: |
          nohup uvicorn api.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -s -X POST localhost:8000/ask -H "X-API-Key: $SRAG_KEY_USER1" -H 'Content-Type: application/json' \
            -d '{"question":"What is least privilege?"}' > /dev/null  # warm up the model
      - name: Offline evaluation with the real embeddings
        run: python eval/run_eval.py --reindex
      - name: Evaluate the answers
        run: python eval/run_e2e.py --questions 20
      - name: Screenshots
        run: python scripts/screenshots.py
      - name: Publish results to the e2e-results branch
        if: always()
        run: |
          mkdir -p /tmp/out/reports /tmp/out/docs
          cp reports/*.json reports/*.txt /tmp/out/reports/ 2>/dev/null || true
          cp docs/*.png /tmp/out/docs/ 2>/dev/null || true
          tail -n 40 api.log | grep -v -i "key" > /tmp/out/reports/api_tail.txt || true
          cd /tmp/out
          git init -q -b e2e-results
          git config user.name "Ahmed Benmohamed"
          git config user.email "166703502+ahmedbmohamed@users.noreply.github.com"
          git add -A && git commit -q -m "End-to-end results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" e2e-results
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-results
          path: |
            reports/e2e.json
            docs/*.png
            api.log
            logs/audit.jsonl
